<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Happiness Journal</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Happiness" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1A1A1A" />

    <!-- Convex SDK -->
    <script src="https://unpkg.com/convex@1.21.0/dist/browser.bundle.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@0,300;0,400;1,300&family=Courier+Prime:wght@400;700&display=swap");

      @font-face {
        font-family: "Neue Haas Grotesk";
        src: url("/Users/jazulynn/Downloads/Neue Haas Grotesk Collection/NeueHaasDisplayRoman.ttf")
          format("truetype");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "Neue Haas Grotesk";
        src: url("/Users/jazulynn/Downloads/Neue Haas Grotesk Collection/NeueHaasDisplayMediu.ttf")
          format("truetype");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "Neue Haas Grotesk";
        src: url("/Users/jazulynn/Downloads/Neue Haas Grotesk Collection/NeueHaasDisplayBold.ttf")
          format("truetype");
        font-weight: 600;
        font-style: normal;
      }

      :root {
        --color-bg: #f5f5f5;
        --color-surface: #ffffff;
        --color-text: #1a1a1a;
        --color-text-secondary: #8e8e93;
        --color-text-tertiary: #c7c7cc;
        --color-accent: #007aff;
        --color-danger: #ff3b30;

        --pink: #fcd1cd;
        --yellow: #fdea88;
        --orange: #f0832c;
        --pistachio: #cbd183;
        --green: #7cbe59;
        --blue: #b7d8fe;
        --purple: #ecddfe;
        --magenta: #d17089;
        --white: #ffffff;

        --radius-sm: 12px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --radius-xl: 32px;

        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08);

        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html {
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: "Neue Haas Grotesk", "Inter", -apple-system,
          BlinkMacSystemFont, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        overflow-x: hidden;
        max-width: 100vw;
        position: relative;
        min-height: 100vh;
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Top Bar - Minimal */
      .top-bar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(245, 245, 245, 0.95);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        padding: calc(env(safe-area-inset-top) + 32px) 24px 0 24px;
        height: calc(84px + env(safe-area-inset-top));
        display: flex;
        align-items: center;
      }

      .top-bar-content {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .top-bar h1 {
        font-family: "Neue Haas Grotesk", "Inter", -apple-system,
          BlinkMacSystemFont, sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: var(--color-text);
      }

      .categories-btn {
        background: none;
        border: none;
        color: var(--color-text);
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
        transition: all 0.2s var(--ease-out);
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
        position: absolute;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .categories-btn.visible {
        opacity: 1;
        transform: scale(1);
        pointer-events: all;
      }

      .categories-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .categories-btn svg {
        width: 24px;
        height: 24px;
      }

      .add-btn {
        background: none;
        border: none;
        color: var(--color-text);
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
        transition: all 0.2s var(--ease-out);
        position: absolute;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .add-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .add-btn svg {
        width: 24px;
        height: 24px;
      }

      .settings-btn {
        position: fixed;
        bottom: calc(32px + env(safe-area-inset-bottom));
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 0.5px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.3s var(--spring);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .settings-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
      }

      .settings-btn:active {
        transform: scale(0.95);
      }

      .settings-btn svg {
        width: 24px;
        height: 24px;
      }

      /* Main Container */
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 24px 120px;
      }

      /* Empty State */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        opacity: 0;
        animation: fadeIn 0.8s var(--ease-out) 0.2s forwards;
      }

      .empty-state-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        opacity: 0.3;
      }

      .empty-state h2 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        color: var(--color-text);
      }

      .empty-state p {
        font-size: 16px;
        color: var(--color-text-secondary);
        font-weight: 400;
      }

      /* Grid Layout */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        animation: fadeIn 0.8s var(--ease-out) 0.1s both;
      }

      /* Post-it Card */
      .post-it {
        border-radius: var(--radius-md);
        padding: 20px;
        background: var(--yellow);
        position: relative;
        cursor: pointer;
        transition: transform 0.3s var(--spring),
          box-shadow 0.3s var(--ease-out);
        box-shadow: var(--shadow-sm);
        animation: cardIn 0.6s var(--spring) both;
        height: 200px;
        display: flex;
        flex-direction: column;
      }

      .post-it:nth-child(1) {
        animation-delay: 0.1s;
      }
      .post-it:nth-child(2) {
        animation-delay: 0.15s;
      }
      .post-it:nth-child(3) {
        animation-delay: 0.2s;
      }
      .post-it:nth-child(4) {
        animation-delay: 0.25s;
      }
      .post-it:nth-child(5) {
        animation-delay: 0.3s;
      }
      .post-it:nth-child(6) {
        animation-delay: 0.35s;
      }
      .post-it:nth-child(n + 7) {
        animation-delay: 0.4s;
      }

      .post-it:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
      }

      .post-it:active {
        transform: scale(0.98);
      }

      .post-it-image {
        width: calc(100% + 40px);
        margin: -20px -20px 12px -20px;
        height: 120px;
        object-fit: cover;
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        flex-shrink: 0;
      }

      .post-it-text {
        font-family: "Newsreader", Georgia, serif;
        font-size: 15px;
        line-height: 1.6;
        color: rgba(0, 0, 0, 0.85);
        font-weight: 400;
        flex: 1;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        text-overflow: ellipsis;
        min-height: 0;
      }

      .post-it-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.4);
        font-weight: 500;
        margin-bottom: 12px;
        flex-shrink: 0;
      }

      .post-it-category {
        background: rgba(255, 255, 255, 0.1);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: rgba(0, 0, 0, 0.6);
      }

      /* FAB Button - Hidden */
      .fab {
        display: none;
      }

      /* Modal Overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        z-index: 2000;
        display: none;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        transition: background 0.4s var(--ease-out),
          backdrop-filter 0.4s var(--ease-out);
      }

      .modal-overlay.active {
        display: block;
        background: transparent;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* Bottom Sheet Modal */
      .modal {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #e8e8e8;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        max-height: 90vh;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 2001;
        transform: translateY(100%);
        transition: transform 0.5s var(--spring);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .modal-overlay.active .modal {
        transform: translateY(0);
      }

      .modal-handle {
        width: 36px;
        height: 5px;
        background: var(--color-text-tertiary);
        border-radius: 3px;
        margin: 12px auto 8px;
      }

      .modal-header {
        padding: 8px 20px 20px;
        border-bottom: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #e8e8e8;
      }

      @media (max-width: 400px) {
        .modal-header {
          padding: 8px 16px 16px;
        }
      }

      .modal-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: var(--color-text);
      }

      .header-save-btn {
        background: none;
        border: none;
        color: var(--color-text);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.2s var(--ease-out);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .header-save-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }

      .header-save-btn svg {
        width: 20px;
        height: 20px;
      }

      .delete-btn {
        width: 100%;
        max-width: 100%;
        padding: 14px;
        background: #fee2e2;
        color: #dc2626;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
        display: none;
        margin-top: 20px;
        box-sizing: border-box;
      }

      @media (max-width: 400px) {
        .delete-btn {
          padding: 12px;
          font-size: 15px;
          margin-top: 16px;
        }
      }

      .delete-btn.visible {
        display: block;
      }

      .delete-btn:hover {
        background: #fecaca;
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .delete-btn:active {
        transform: scale(0.98);
      }

      .modal-content {
        padding: 20px;
        max-width: 100%;
        overflow-x: hidden;
      }

      @media (max-width: 400px) {
        .modal-content {
          padding: 16px;
        }
      }

      /* Note Preview */
      .note-preview {
        background: var(--yellow);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 20px;
        min-height: 280px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        transition: background 0.3s var(--ease-out);
        position: relative;
        overflow: hidden;
        border: 6px solid white;
      }

      @media (max-width: 400px) {
        .note-preview {
          padding: 16px;
          margin-bottom: 16px;
          border: 4px solid white;
        }
      }

      .note-preview::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.03"/></svg>');
        pointer-events: none;
        opacity: 0.5;
      }

      .preview-image {
        width: calc(100% + 48px);
        height: 200px;
        object-fit: cover;
        border-radius: var(--radius-md);
        margin: -24px -24px 16px -24px;
      }

      .note-preview textarea {
        background: transparent;
        border: none;
        font-family: "Newsreader", Georgia, serif;
        font-size: 17px;
        line-height: 1.6;
        color: rgba(0, 0, 0, 0.85);
        resize: none;
        width: 100%;
        min-height: 200px;
        outline: none;
        position: relative;
        z-index: 1;
      }

      .note-preview textarea::placeholder {
        color: rgba(0, 0, 0, 0.3);
        font-style: italic;
        font-weight: 300;
      }

      /* Controls */
      .controls-container {
        background: white;
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-sm);
        max-width: 100%;
        width: 100%;
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      @media (max-width: 400px) {
        .controls-container {
          padding: 16px;
        }
      }

      .control-section {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .control-section:last-of-type {
        margin-bottom: 0;
      }

      @media (max-width: 400px) {
        .control-section {
          margin-bottom: 16px;
        }
      }

      .control-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--color-text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        display: block;
      }

      @media (max-width: 400px) {
        .control-label {
          font-size: 11px;
          margin-bottom: 8px;
        }
      }

      /* Date Input */
      .date-input {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 10px 8px;
        background: var(--color-bg);
        border: 1px solid var(--color-text-tertiary);
        border-radius: var(--radius-sm);
        font-family: "Inter", sans-serif;
        font-size: 14px;
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
        box-sizing: border-box;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        flex-shrink: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (max-width: 400px) {
        .date-input {
          padding: 8px 6px;
          font-size: 13px;
        }
      }

      @media (max-width: 360px) {
        .date-input {
          padding: 8px 4px;
          font-size: 12px;
        }
      }

      /* iOS date picker specific fixes */
      .date-input::-webkit-date-and-time-value {
        text-align: center;
        min-width: 0;
        max-width: 100%;
      }

      .date-input::-webkit-datetime-edit {
        min-width: 0;
        max-width: 100%;
        padding: 0;
      }

      .date-input::-webkit-datetime-edit-fields-wrapper {
        min-width: 0;
        max-width: 100%;
      }

      .date-input:hover {
        border-color: var(--color-accent);
      }

      .date-input:focus {
        outline: none;
        border-color: var(--color-accent);
        background: rgba(0, 122, 255, 0.04);
      }

      .color-picker {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .color-option {
        width: 32px;
        height: 32px;
        min-width: 32px;
        min-height: 32px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.3s var(--spring);
        position: relative;
        flex-shrink: 0;
        aspect-ratio: 1 / 1;
      }

      .color-option::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid currentColor;
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.3s var(--spring);
      }

      .color-option:hover {
        transform: scale(1.15);
      }

      .color-option.selected {
        transform: scale(1.1);
      }

      .color-option.selected::after {
        opacity: 0.3;
        transform: scale(1);
      }

      /* Image Upload */
      .image-upload-btn {
        width: 100%;
        max-width: 100%;
        padding: 14px;
        background: var(--color-bg);
        border: 2px dashed var(--color-text-tertiary);
        border-radius: var(--radius-sm);
        color: var(--color-text-secondary);
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
      }

      @media (max-width: 400px) {
        .image-upload-btn {
          padding: 12px;
          font-size: 14px;
        }
      }

      @media (max-width: 360px) {
        .image-upload-btn {
          padding: 10px;
          font-size: 13px;
        }
      }

      .image-upload-btn:hover {
        border-color: var(--color-accent);
        color: var(--color-accent);
        background: rgba(0, 122, 255, 0.04);
      }

      .image-upload-btn input {
        display: none;
      }

      /* Save Button */
      .save-btn {
        flex: 1;
        padding: 16px;
        background: var(--color-text);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease-out);
      }

      .save-btn:hover {
        background: #0062cc;
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .save-btn:active {
        transform: scale(0.98);
      }

      .save-btn:disabled {
        background: var(--color-text-tertiary);
        cursor: not-allowed;
        transform: none;
      }

      .save-btn.full-width {
        width: 100%;
      }

      /* Categories Modal */
      .categories-content {
        padding: 0 24px 40px;
      }

      .category-group {
        margin-bottom: 32px;
      }

      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }

      .category-name {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      .category-count {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-accent);
        background: rgba(0, 122, 255, 0.1);
        padding: 4px 12px;
        border-radius: 12px;
      }

      .category-summary {
        background: rgba(0, 0, 0, 0.03);
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--color-text-secondary);
        font-style: italic;
      }

      .categories-legend {
        background: white;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
        box-shadow: var(--shadow-sm);
      }

      .categories-legend h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--color-text);
      }

      .legend-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--color-text-secondary);
      }

      .legend-emoji {
        font-size: 18px;
        width: 24px;
        text-align: center;
      }

      .legend-name {
        font-weight: 500;
        color: var(--color-text);
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);

    <script>
      // State
      let entries = [];
      let selectedColor = "#F3E874";
      let selectedImage = null;
      let editingId = null;
      let viewingId = null;

      // Convex client
      const convexClient = new convex.ConvexHttpClient("https://proficient-alpaca-466.convex.cloud");

      async function loadEntriesFromConvex() {
        try {
          const convexEntries = await convexClient.query("entries:list", {});
          entries = convexEntries.map(e => ({
            id: e._id,
            text: e.text,
            color: e.color,
            image: e.image || null,
            category: e.category,
            date: e.date,
          }));
          renderEntries();
          updateCategoriesButton();
        } catch (error) {
          console.error("Error loading from Convex:", error);
          // Fallback to localStorage
          const saved = localStorage.getItem("happinessEntries");
          if (saved) entries = JSON.parse(saved);
          renderEntries();
          updateCategoriesButton();
        }
      }

      async function saveEntryToConvex(entry) {
        try {
          if (entry.id && typeof entry.id === "string" && entry.id.startsWith("j")) {
            // Existing Convex entry — update
            await convexClient.mutation("entries:update", {
              id: entry.id,
              text: entry.text,
              color: entry.color,
              image: entry.image || null,
              category: entry.category,
              date: entry.date,
            });
          } else {
            // New entry — create
            const newId = await convexClient.mutation("entries:create", {
              text: entry.text,
              color: entry.color,
              image: entry.image || null,
              category: entry.category,
              date: entry.date,
            });
            entry.id = newId;
          }
          // Reload from Convex to stay in sync
          await loadEntriesFromConvex();
          return true;
        } catch (error) {
          console.error("Error saving to Convex:", error);
          throw error;
        }
      }

      async function deleteEntryFromConvex(entryId) {
        try {
          await convexClient.mutation("entries:remove", { id: entryId });
          await loadEntriesFromConvex();
          return true;
        } catch (error) {
          console.error("Error deleting from Convex:", error);
          throw error;
        }
      }


      // Settings Functions
      function openSettings() {
        document.getElementById("settingsModal").classList.add("active");
      }

      function exportData() {
        const data = {
          exportedAt: new Date().toISOString(),
          entryCount: entries.length,
          entries: entries,
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `happiness-journal-export-${new Date().toISOString().split("T")[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      const socialSignals = [
        "with my", "with her", "with him", "with them", "with us",

        "mom", "dad", "sister", "brother", "family", "friend", "friends",

      function categorizeEntry(text) {
        const lower = text.toLowerCase();

        // Check if social/relational context is present
        const hasSocialContext = socialSignals.some((s) => lower.includes(s));

        // Score each category
        const scores = {};
        for (const [category, keywords] of Object.entries(categoryKeywords)) {
          let score = 0;
          for (const kw of keywords) {
            if (lower.includes(kw)) {
              // Multi-word phrases score higher (more specific)
              score += kw.includes(" ") ? 3 : 1;
            }
          }
          if (score > 0) scores[category] = score;
        }

        // If social context is present, boost relational categories
        // and suppress activity-based ones (tag the feeling, not the action)
        if (hasSocialContext) {
          const relational = ["Love & Connection", "Belonging & Community", "Celebration & Joy", "Care & Generosity"];
          const activityBased = ["Stories & Narrative", "Culinary Pleasure", "Vitality & Strength", "Simple Pleasures"];

          for (const cat of relational) {
            if (scores[cat]) scores[cat] += 5;
          }
          // If a relational category matched, demote pure activity categories
          if (relational.some((c) => scores[c])) {
            for (const cat of activityBased) {
              if (scores[cat]) scores[cat] = Math.max(0, scores[cat] - 3);
            }
          }

          // If we have social context but no relational match yet, default to Belonging
          if (!relational.some((c) => scores[c])) {
            scores["Belonging & Community"] = (scores["Belonging & Community"] || 0) + 3;
          }
        }

        // Pick the highest scoring category
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        if (sorted.length > 0 && sorted[0][1] > 0) {
          return sorted[0][0];
        }

        return "Simple Pleasures";
      }

      // Swipe gesture support
      function initSwipeGestures() {
        const modalConfigs = [
          { id: "addModal", overlay: "addModal" },
          { id: "viewModal", overlay: "viewModal" },
          { id: "categoriesModal", overlay: "categoriesModal" },
          { id: "settingsModal", overlay: "settingsModal" },
        ];

        modalConfigs.forEach((config) => {
          const overlayElement = document.getElementById(config.overlay);
          if (!overlayElement) return;

          const modalElement = overlayElement.querySelector(".modal");
          if (!modalElement) return;

          let touchStartY = 0;
          let touchCurrentY = 0;
          let isDragging = false;
          let startedOnHandle = false;

          modalElement.addEventListener(
            "touchstart",
            (e) => {
              // Check if touch started on modal handle or header
              const target = e.target;
              startedOnHandle =
                target.classList.contains("modal-handle") ||
                target.classList.contains("modal-header") ||
                target.closest(".modal-handle") ||
                target.closest(".modal-header");

              touchStartY = e.touches[0].clientY;
              touchCurrentY = touchStartY;
              isDragging = true;
            },
            { passive: true }
          );

          modalElement.addEventListener(
            "touchmove",
            (e) => {
              if (!isDragging || !startedOnHandle) return;
              touchCurrentY = e.touches[0].clientY;
              const diff = touchCurrentY - touchStartY;

              // Only allow dragging down
              if (diff > 0) {
                modalElement.style.transform = `translateY(${diff}px)`;
              }
            },
            { passive: true }
          );

          modalElement.addEventListener("touchend", () => {
            if (!isDragging) return;
            isDragging = false;

            const diff = touchCurrentY - touchStartY;
            const threshold = 80; // Swipe down more than 80px to close

            if (diff > threshold && startedOnHandle) {
              // Close the modal
              overlayElement.classList.remove("active");
              modalElement.style.transform = "";

              // Reset state based on modal type
              if (config.id === "viewModal") {
                viewingId = null;
              } else if (config.id === "addModal") {
                setTimeout(() => {
                  editingId = null;
                  document.getElementById("entryText").value = "";
                  document.getElementById("previewImage").style.display =
                    "none";
                  document.getElementById("imageUploadText").textContent =
                    "Add image";
                  selectedImage = null;
                  selectedColor = "#F3E874";
                  selectColor("#F3E874");
                }, 400);
              }
            } else {
              // Snap back
              modalElement.style.transform = "";
            }

            startedOnHandle = false;
          });
        });
      }

      function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // Calculate new dimensions
              let width = img.width;
              let height = img.height;

              if (width > maxWidth) {
                height = (height * maxWidth) / width;
                width = maxWidth;
              }

              // Create canvas and compress
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              // Convert to compressed base64
              const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
              resolve(compressedDataUrl);
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
          try {
            // Compress image before storing
            selectedImage = await compressImage(file, 800, 0.7);
            const img = document.getElementById("previewImage");
            img.src = selectedImage;
            img.style.display = "block";
            document.getElementById("imageUploadText").textContent =
              "Change image";
          } catch (error) {
            console.error("Error compressing image:", error);
            alert("Failed to process image. Please try a different image.");
          }
        }
      }

      async function saveEntry() {
        const text = document.getElementById("entryText").value.trim();
        if (!text) return;

        // Show loading state
        const saveBtn = document.querySelector(".header-save-btn");
        const originalText = saveBtn.innerHTML;
        const loadingMessage = "Saving...";

        saveBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 6v6l4 2"></path>
                </svg>
                ${loadingMessage}
              `;
        saveBtn.disabled = true;

        try {
          const dateInput = document.getElementById("dateInput").value;
          const selectedDate = dateInput
            ? new Date(dateInput + "T12:00:00")
            : new Date();

          const category = categorizeEntry(text);

          let entry;
          if (editingId) {
            // Update existing entry
            const existingEntry = entries.find((e) => e.id === editingId);
            if (!existingEntry) {
              console.error("Entry not found:", editingId);
              throw new Error("Entry not found. Please refresh and try again.");
            }
            entry = {
              id: existingEntry.id,
              text,
              color: selectedColor,
              image: selectedImage,
              category: category,
              date: selectedDate.toISOString(),
            };
          } else {
            // Create new entry
            entry = {
              id: Date.now(),
              text,
              color: selectedColor,
              image: selectedImage,
              category: category,
              date: selectedDate.toISOString(),
            };
          }

          // Save to Convex
          await saveEntryToConvex(entry);

          closeModal();
        } catch (error) {
          console.error("Error saving entry:", error);

          // Check if it's a quota exceeded error
          if (
            error.name === "QuotaExceededError" ||
            error.message.includes("quota")
          ) {
            alert(
              "Storage limit exceeded! Your images are too large.\n\nTip: Try removing images from older notes or use smaller photos."
            );
          } else {
            alert(
              `Failed to save entry: ${error.message || "Please try again."}`
            );
          }
        } finally {
          // Always restore button
          saveBtn.innerHTML = originalText;
          saveBtn.disabled = false;
        }
      }

        if (
          confirm(
            "⚠️ Delete this entry?\n\nThis will permanently delete your note and cannot be undone.\n\nAre you sure you want to continue?"
          )
        ) {
          await deleteEntryFromConvex(editingId);
          closeModal();
        }
      }

      function renderEntries() {
        const grid = document.getElementById("grid");
        const empty = document.getElementById("emptyState");

        if (entries.length === 0) {
          grid.style.display = "none";
          empty.style.display = "flex";
          return;
        }

        empty.style.display = "none";
        grid.style.display = "grid";

        // Sort by date descending (newest first) for grid layout - newest top-left, oldest bottom-right
        const sortedEntries = [...entries].sort(
          (a, b) => new Date(b.date) - new Date(a.date)
        );

        grid.innerHTML = sortedEntries
          .map((entry, idx) => {
            if (!entry || !entry.id || !entry.text) {
              console.warn("Invalid entry skipped:", entry);
              return "";
            }
            const color = entry.color || "#F3E874";
            const category = entry.category || "Simple Pleasures";
            return `
                      <div class="post-it" style="background: ${
                        color
                      }; animation-delay: ${idx * 0.05}s" onclick="viewEntry('${
              entry.id
            }')">
                          ${
                            entry.image
                              ? `<img src="${entry.image}" class="post-it-image">`
                              : ""
                          }
                          <div class="post-it-footer">
                              <span>${new Date(entry.date).toLocaleDateString(
                                "en-US",
                                {
                                  month: "short",
                                  day: "numeric",
                                  year: "numeric",
                                }
                              )}</span>
                              <span class="post-it-category">${getCategoryEmoji(
                                category
                              )} ${category.toLowerCase()}</span>
                          </div>
                          <div class="post-it-text">${entry.text}</div>
                      </div>
                    `;
          })
          .join("");
      }

      function updateCategoriesButton() {
        const btn = document.getElementById("categoriesBtn");
        if (entries.length >= 5) {
          btn.classList.add("visible");
        } else {
          btn.classList.remove("visible");
        }
      }

      async function showCategories() {
        const grouped = {};
        entries.forEach((e) => {
          const cat = e.category || "Simple Pleasures";
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(e);
        });

        const sorted = Object.entries(grouped).sort(
          (a, b) => b[1].length - a[1].length
        );
        const content = document.getElementById("categoriesContent");

        // Show loading state
        content.innerHTML =
          '<div style="padding: 40px; text-align: center; color: var(--color-text-secondary);">Generating insights...</div>';
        document.getElementById("categoriesModal").classList.add("active");

        // Generate summaries (with AI if available)
        const categoriesHTML = await Promise.all(
          sorted.map(async ([cat, items]) => {
            const summary = await generateCategorySummary(cat, items);
            return `
                          <div class="category-group">
                              <div class="category-header">
                                  <h3 class="category-name">${getCategoryEmoji(
                                    cat
                                  )} ${cat.toLowerCase()}</h3>
                                  <span class="category-count">${
                                    items.length
                                  }</span>
                              </div>
                              <div class="category-summary">
                                  ${summary}
                              </div>
                              <div class="grid">
                                  ${items
                                    .map(
                                      (e) => `
                                      <div class="post-it" style="background: ${
                                        e.color
                                      }" onclick="closeCategoriesModal(); viewEntry('${
                                        e.id
                                      }');">
                                          ${
                                            e.image
                                              ? `<img src="${e.image}" class="post-it-image">`
                                              : ""
                                          }
                                          <div class="post-it-footer">
                                              <span>${new Date(
                                                e.date
                                              ).toLocaleDateString("en-US", {
                                                month: "short",
                                                day: "numeric",
                                              })}</span>
                                              <span class="post-it-category">${getCategoryEmoji(
                                                e.category || "Simple Pleasures"
                                              )} ${(e.category || "Simple Pleasures").toLowerCase()}</span>
                                          </div>
                                          <div class="post-it-text">${
                                            e.text
                                          }</div>
                                      </div>
                                  `
                                    )
                                    .join("")}
                              </div>
                          </div>
                      `;
          })
        );

        content.innerHTML = categoriesHTML.join("");
      }

      function closeCategoriesModal() {
        document.getElementById("categoriesModal").classList.remove("active");
      }

      init();

      // Register service worker for PWA
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((reg) => console.log("Service Worker registered"))
            .catch((err) => console.log("Service Worker registration failed"));
        });
      }
    </script>
  </body>
</html>
